backend:
  name: github
  repo: Naitikkaklotar/architect-portfolio
  branch: main
  # Live GitHub login via Cloudflare OAuth proxy Worker
  base_url: https://architect-decap-oauth.kkarchitect.workers.dev
  auth_endpoint: /auth

# Local only: when running `npx decap-server` on localhost.
# Ignored on the live site (non-localhost).
local_backend: true

site_url: https://architect-portfolio.kkarchitect.workers.dev
display_url: https://architect-portfolio.kkarchitect.workers.dev
logo_url: /uploads/hero.jpg

media_folder: public/uploads
public_folder: /uploads

collections:
  - name: projects
    label: Projects
    label_singular: Project
    description: >
      Add a new project in a few steps: (1) name & details,
      (2) cover + gallery photos, (3) optional YouTube link,
      (4) write a short description, then click Publish / Save.
      Photos go into public/uploads. Tip: turn Featured ON to show it on the homepage.
    folder: content/projects
    create: true
    delete: true
    slug: "{{slug}}"
    extension: md
    format: frontmatter
    identifier_field: title
    summary: "{{title}} — {{category}} · {{year}}"
    sortable_fields: ["title", "year", "category", "location"]
    view_groups:
      - label: By category
        field: category
    preview_path: "projects/{{slug}}"
    editor:
      preview: true
    fields:
      - label: "1. Project name"
        name: title
        widget: string
        hint: "The name visitors will see (example: Villa Sunrise)."

      - label: "Short card description"
        name: excerpt
        widget: text
        required: false
        hint: "1–2 lines under the project image on listing cards. Leave blank to use the start of the full description."

      - label: "2. Category"
        name: category
        widget: select
        options:
          - { label: "Residential — homes & villas", value: Residential }
          - { label: "Commercial — offices & shops", value: Commercial }
          - { label: "Interior — interiors only", value: Interior }
          - { label: "Other", value: Other }
        default: Residential
        hint: "Used for the filter buttons on the Projects page."

      - label: "3. Location"
        name: location
        widget: string
        hint: "City or area (example: Ahmedabad)."

      - label: "4. Year"
        name: year
        widget: number
        value_type: int
        default: 2025
        min: 1990
        max: 2100
        hint: "Completion year (numbers only)."

      - label: "5. Area"
        name: area
        widget: string
        required: false
        hint: "Built-up size, e.g. 3500 sq ft. Leave blank if you are not sure."

      - label: "6. Your role"
        name: role
        widget: string
        required: false
        hint: "Example: Lead Architect, Interior Architect, Design Architect."

      - label: "7. Status"
        name: status
        widget: select
        required: false
        options: [Completed, Under construction, Concept, On hold]
        default: Completed
        hint: "Shown on the project detail info bar."

      - label: "8. Show on homepage?"
        name: featured
        widget: boolean
        default: false
        hint: "**ON** = appears in Featured on the home page. **OFF** = only on the Projects list."

      - label: "9. Cover photo"
        name: cover
        widget: image
        choose_url: true
        hint: "Main image for cards and the project hero. Click Choose image to upload, or paste an image URL."

      - label: "10. Gallery photos"
        name: images
        widget: list
        required: false
        summary: "{{caption}} — {{image}}"
        allow_add: true
        hint: "Add room photos (Kitchen, Bedroom, Living…). Click **+** for each photo and add a short caption."
        fields:
          - label: Photo
            name: image
            widget: image
            choose_url: true
          - label: Room / caption
            name: caption
            widget: string
            hint: "Example: Kitchen, Bedroom, Living room, Courtyard"
          - label: Description under image
            name: description
            widget: text
            required: false
            hint: "1–2 short lines shown below the photo on the project page."
          - label: Clickable pieces on photo (hotspots)
            name: hotspots
            widget: list
            required: false
            summary: "{{label}} → {{href}}"
            hint: "Optional. Place markers on the photo (X/Y = % from left/top). Link to a product page like /products/living-sofa or any URL."
            fields:
              - { label: Piece name, name: label, widget: string, hint: "Example: Sofa, Lounge chair" }
              - { label: X position % (0–100 from left), name: x, widget: number, value_type: float, min: 0, max: 100, default: 50 }
              - { label: Y position % (0–100 from top), name: y, widget: number, value_type: float, min: 0, max: 100, default: 50 }
              - { label: Link to product / page, name: href, widget: string, hint: "/products/living-sofa or https://…" }

      - label: "Gallery shape (optional)"
        name: gallery_aspect
        widget: select
        required: false
        default: ""
        options:
          - { label: "Mixed (wide + pairs) — for normal photos", value: "" }
          - { label: "Square 1:1 — for square renders", value: "1/1" }
        hint: "Use Square when your gallery images are square renders, so nothing is cropped."

      - label: "Floor plans (optional)"
        name: plans
        widget: list
        required: false
        summary: "{{title}}"
        hint: "One entry per floor. Shown as tabs on the project page. Upload the plan as a JPG/PNG image."
        fields:
          - { label: Plan image, name: image, widget: image, choose_url: true }
          - { label: Title, name: title, widget: string, hint: "Example: First floor — living, dining & kitchen. The text before the dash is the tab name." }
          - { label: Note, name: description, widget: text, required: false }

      - label: "11. YouTube video"
        name: video
        widget: string
        required: false
        hint: "Paste any YouTube link — `youtu.be/...` or `youtube.com/watch?v=...`. Leave empty if there is no video."
        pattern:
          - '^$|^(https?:\/\/)?(www\.)?(youtube\.com|youtu\.be)\/.+'
          - "Please paste a valid YouTube link, or leave this field empty."

      - label: "Climate report (optional)"
        name: climate
        widget: object
        required: false
        collapsed: true
        hint: "Adds the 'Climate report' section with the sun-path slider. Leave empty to hide it."
        fields:
          - { label: Intro line, name: intro, widget: text, required: false }
          - { label: Screen name, name: screen_name, widget: string, required: false, default: "Jaali screen", hint: "Shown on the sun diagram, e.g. Jaali screen, Louvres." }
          - { label: "West sun cut by shading (%)", name: screen_cut, widget: number, value_type: int, min: 1, max: 99, default: 78, required: false, hint: "Design target, used by the sun slider (e.g. 75–80 → 78)." }
          - label: Key benefits (3–4 big numbers)
            name: benefits
            widget: list
            required: false
            summary: "{{value}} — {{label}}"
            fields:
              - { label: Number, name: value, widget: string, hint: "e.g. 2–3°C" }
              - { label: Label, name: label, widget: string, hint: "e.g. Cooler indoors" }
          - label: Sustainable features
            name: features
            widget: list
            required: false
            summary: "{{title}}"
            fields:
              - { label: Title, name: title, widget: string }
              - { label: Explanation, name: text, widget: text, required: false }

      - label: "12. Project description"
        name: body
        widget: markdown
        hint: "Write 1–3 short paragraphs about the project. You can use **bold**, lists, and links."

  - name: products
    label: Products / pieces
    label_singular: Product
    description: >
      Furniture or finish pieces linked from photo hotspots.
      Create a product here, then on a project gallery image add a hotspot
      with link /products/your-slug.
    folder: content/products
    create: true
    delete: true
    slug: "{{slug}}"
    extension: md
    format: frontmatter
    identifier_field: title
    summary: "{{title}} — {{category}}"
    fields:
      - { label: Name, name: title, widget: string }
      - { label: Brand / note, name: brand, widget: string, required: false }
      - { label: Category, name: category, widget: string, required: false, hint: "Seating, Lighting, Table…" }
      - { label: Price note, name: price, widget: string, required: false, hint: "On request, or a price" }
      - { label: Cover image, name: cover, widget: image, required: false }
      - { label: Short summary, name: summary, widget: text, required: false }
      - { label: Full description, name: body, widget: markdown }

  - name: settings
    label: Site settings
    description: "Numbers and text used by site tools."
    files:
      - name: estimator
        label: Budget estimator rates
        file: content/settings/estimator.json
        format: json
        description: >
          Rates are in rupees per square foot (low and high), per project type and finish.
          Check these before promoting the estimator — they decide the budget range visitors see.
        fields:
          - { label: Intro text, name: intro, widget: text, required: false }
          - { label: "Design fee — low (% of build cost)", name: design_fee_low, widget: number, value_type: float, min: 0, max: 30 }
          - { label: "Design fee — high (% of build cost)", name: design_fee_high, widget: number, value_type: float, min: 0, max: 30 }
          - label: City price factor
            name: city_factors
            widget: list
            summary: "{{city}} × {{factor}}"
            hint: "1 = base price. Mumbai 1.35 means 35% higher than the base."
            fields:
              - { label: City, name: city, widget: string }
              - { label: Factor, name: factor, widget: number, value_type: float, min: 0.5, max: 3 }
          - label: Project types and rates (₹ per sq ft)
            name: types
            widget: list
            summary: "{{label}}"
            fields:
              - { label: ID (short, no spaces), name: id, widget: string }
              - { label: Name shown to visitors, name: label, widget: string }
              - { label: Standard — low, name: standard_low, widget: number, value_type: int, min: 0 }
              - { label: Standard — high, name: standard_high, widget: number, value_type: int, min: 0 }
              - { label: Premium — low, name: premium_low, widget: number, value_type: int, min: 0 }
              - { label: Premium — high, name: premium_high, widget: number, value_type: int, min: 0 }
              - { label: Luxury — low, name: luxury_low, widget: number, value_type: int, min: 0 }
              - { label: Luxury — high, name: luxury_high, widget: number, value_type: int, min: 0 }
