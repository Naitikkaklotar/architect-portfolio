<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <title>KK Architect — Admin</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=EB+Garamond:wght@400;500;600&family=Inter:wght@400;500;600&family=Jost:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/admin/admin.css" />
  </head>
  <body>
    <a class="kk-start" href="/admin/start.html" title="Start page">⌂ Start</a>
    <a class="kk-help" href="/admin/guide.html" target="_blank" rel="noopener" title="Help &amp; guide" aria-label="Help and guide">?</a>
    <script src="/admin/extras.js"></script>
    <!-- Pinned version + integrity hash: a new Decap release cannot silently change or break the admin. -->
    <script
      src="https://unpkg.com/decap-cms@3.17.3/dist/decap-cms.js"
      integrity="sha384-RWRzuHfiZSWCt3nEvG7B0v3cMgM1C2UuJmgBSL92GQh4uXmNSkbcthql/mNBqvjr"
      crossorigin="anonymous"
    ></script>
    <script>
      CMS.registerPreviewStyle("/admin/preview.css");

      // Never let a half-filled form crash the preview: only accept real text paths/URLs.
      function safeAsset(getAsset, value) {
        if (typeof value !== "string" || !value) return "";
        try {
          var asset = getAsset(value);
          return asset ? asset.toString() : "";
        } catch (e) {
          return "";
        }
      }


      // Small ready-to-publish checklist shown at the top of the preview.
      function checklist(items) {
        return h(
          "ul",
          { className: "preview-check", key: "check" },
          items.map(function (item, i) {
            var cls = item.warn ? "warn" : item.ok ? "ok" : "no";
            var mark = item.warn ? "!" : item.ok ? "✓" : "✗";
            return h("li", { key: i, className: cls }, [
              h("span", { key: "m", className: "mark" }, mark),
              h("span", { key: "t" }, item.text),
            ]);
          })
        );
      }

      // Custom field: click on the photo to place a hotspot marker.
      // Stores "x,y" (percent from left, percent from top).
      var HotspotPosition = createClass({
        getInitialState: function () {
          return { src: "" };
        },
        componentDidMount: function () {
          var self = this;
          this.timer = setInterval(function () {
            self.findImage();
          }, 700);
          this.findImage();
        },
        componentWillUnmount: function () {
          clearInterval(this.timer);
        },
        findImage: function () {
          var el = this.root ? this.root.parentElement : null;
          var outer = null;
          while (el) {
            if (typeof el.className === "string" && /ListItem-listControlItem|SortableListItem/.test(el.className)) {
              outer = el;
            }
            el = el.parentElement;
          }
          if (!outer) return;
          var imgs = outer.querySelectorAll("img:not([data-kk])");
          var src = imgs.length ? imgs[0].getAttribute("src") || "" : "";
          if (src !== this.state.src) this.setState({ src: src });
        },
        parse: function () {
          var v = this.props.value;
          if (typeof v !== "string" || v.indexOf(",") < 0) return null;
          var parts = v.split(",");
          var x = parseFloat(parts[0]);
          var y = parseFloat(parts[1]);
          return isNaN(x) || isNaN(y) ? null : { x: x, y: y };
        },
        onPick: function (e) {
          var rect = e.currentTarget.getBoundingClientRect();
          if (!rect.width || !rect.height) return;
          var x = Math.round(((e.clientX - rect.left) / rect.width) * 1000) / 10;
          var y = Math.round(((e.clientY - rect.top) / rect.height) * 1000) / 10;
          x = Math.min(100, Math.max(0, x));
          y = Math.min(100, Math.max(0, y));
          this.props.onChange(x + "," + y);
        },
        render: function () {
          var self = this;
          var pos = this.parse();
          var src = this.state.src;
          return h(
            "div",
            {
              className: "kk-pos",
              ref: function (node) {
                self.root = node;
              },
            },
            [
              src
                ? h("div", { key: "stage", className: "kk-pos-stage", onClick: this.onPick }, [
                    h("img", { key: "img", "data-kk": "1", src: src, draggable: false, alt: "" }),
                    pos
                      ? h("span", { key: "dot", className: "kk-pos-dot", style: { left: pos.x + "%", top: pos.y + "%" } })
                      : null,
                  ])
                : h(
                    "p",
                    { key: "empty", className: "kk-pos-empty" },
                    "Choose the gallery photo above first. It will appear here so you can click to place the marker."
                  ),
              h(
                "div",
                { key: "read", className: "kk-pos-read" },
                pos
                  ? "Placed at " + pos.x + "% from the left, " + pos.y + "% from the top. Click again to move it."
                  : "Not placed yet. Click on the photo."
              ),
            ]
          );
        },
      });
      CMS.registerWidget("hotspot_position", HotspotPosition);

      var ProjectPreview = createClass({
        render: function () {
          var entry = this.props.entry;
          var getAsset = this.props.getAsset;
          var title = entry.getIn(["data", "title"]) || "Untitled project";
          var category = entry.getIn(["data", "category"]) || "";
          var location = entry.getIn(["data", "location"]) || "";
          var year = entry.getIn(["data", "year"]) || "";
          var area = entry.getIn(["data", "area"]) || "";
          var featured = entry.getIn(["data", "featured"]);
          var cover = entry.getIn(["data", "cover"]);
          var images = entry.getIn(["data", "images"]);
          var video = entry.getIn(["data", "video"]);

          var meta = [category, location, year, area].filter(Boolean).join(" · ");

          var coverSrc = safeAsset(getAsset, cover);
          var coverNode = coverSrc
            ? h("img", {
                className: "preview-cover",
                src: coverSrc,
                alt: title + " cover",
              })
            : h(
                "div",
                { className: "preview-cover-empty" },
                "Upload a cover photo to see it here"
              );

          var galleryNodes = [];
          var hidden = entry.getIn(["data", "hidden"]);
          var bodyText = entry.getIn(["data", "body"]) || "";
          if (images && images.size) {
            images.forEach(function (img, index) {
              var path = typeof img === "string" ? img : img && img.get ? img.get("image") : "";
              var src = safeAsset(getAsset, path);
              if (!src) return;
              galleryNodes.push(
                h("img", {
                  key: index + src,
                  src: src,
                  alt: title + " gallery",
                })
              );
            });
          }

          var galleryCount = galleryNodes.length;
          var slug =
            entry.get("slug") ||
            String(title)
              .toLowerCase()
              .replace(/[^a-z0-9]+/g, "-")
              .replace(/^-|-$/g, "") ||
            "project-name";
          var mapCity = entry.getIn(["data", "map_city"]) || "";
          var checks = [
            { ok: !!entry.getIn(["data", "title"]), text: "Project name" },
            { ok: !!(location || mapCity), text: "Location (so it can appear on the map)" },
            { ok: !!coverSrc, text: "Cover photo — the big banner" },
            {
              ok: galleryCount >= 3,
              text: galleryCount + (galleryCount === 1 ? " gallery photo" : " gallery photos") + (galleryCount < 3 ? " (add at least 3)" : ""),
            },
            { ok: String(bodyText).length >= 60, text: "Project description" },
          ];
          if (hidden) checks.push({ warn: true, text: "Hidden: this project will NOT show on the website" });

          return h("div", { className: "preview" }, [
            h("div", { className: "preview-guide", key: "guide" }, [
              h("strong", {}, "Live preview"),
              " Fill the form on the left. This pane shows how the project will roughly look on the site.",
            ]),
            h("p", { className: "preview-link", key: "link" }, [
              "Page on the site: ",
              h("code", { key: "c" }, "/projects/" + slug),
            ]),
            checklist(checks),
            coverNode,
            featured
              ? h("span", { className: "preview-badge", key: "badge" }, "Featured on homepage")
              : null,
            h("h1", { className: "preview-title", key: "title" }, title),
            h("p", { className: "preview-meta", key: "meta" }, meta || "Add category, location & year"),
            video
              ? h(
                  "p",
                  { className: "preview-meta", key: "video" },
                  "Video linked: " + video
                )
              : null,
            h("div", { className: "preview-body", key: "body" }, this.props.widgetFor("body")),
            galleryNodes.length
              ? h("div", { className: "preview-gallery", key: "gallery" }, galleryNodes)
              : null,
          ]);
        },
      });

      var ProductPreview = createClass({
        render: function () {
          var entry = this.props.entry;
          var getAsset = this.props.getAsset;
          var title = entry.getIn(["data", "title"]) || "Untitled product";
          var category = entry.getIn(["data", "category"]) || "";
          var price = entry.getIn(["data", "price"]) || "";
          var summary = entry.getIn(["data", "summary"]) || "";
          var coverSrc = safeAsset(getAsset, entry.getIn(["data", "cover"]));

          var pChecks = [
            { ok: !!entry.getIn(["data", "title"]), text: "Product name" },
            { ok: !!coverSrc, text: "Cover image" },
            { ok: !!summary, text: "Short summary" },
          ];

          return h("div", { className: "preview" }, [
            checklist(pChecks),
            coverSrc
              ? h("img", {
                  key: "cover",
                  className: "preview-cover",
                  src: coverSrc,
                  alt: title,
                })
              : h("div", { key: "empty", className: "preview-cover-empty" }, "Add a cover image to see it here"),
            h("h1", { className: "preview-title", key: "title" }, title),
            h("p", { className: "preview-meta", key: "meta" }, [category, price].filter(Boolean).join(" · ") || "Add category and price note"),
            summary ? h("p", { key: "summary" }, summary) : null,
            h("div", { className: "preview-body", key: "body" }, this.props.widgetFor("body")),
          ]);
        },
      });

      // Readable preview for the text pages and settings (Home, About, Services, Contact, Map, Estimator).
      function renderValue(value, depth, key) {
        if (value === null || value === undefined || value === "") return null;
        if (Array.isArray(value)) {
          return h(
            "ul",
            { key: key, style: { margin: "4px 0 10px", paddingLeft: "20px" } },
            value.map(function (item, i) {
              return h("li", { key: i, style: { marginBottom: "6px" } }, renderValue(item, depth + 1, i));
            })
          );
        }
        if (typeof value === "object") {
          return h(
            "div",
            { key: key },
            Object.keys(value).map(function (k) {
              var inner = renderValue(value[k], depth + 1, k);
              if (inner === null) return null;
              return h("div", { key: k, style: { marginBottom: "4px" } }, [
                h("span", { key: "k", style: { opacity: 0.55, fontSize: "12px", textTransform: "uppercase", letterSpacing: "0.06em" } }, k.replace(/_/g, " ") + " "),
                h("span", { key: "v" }, inner),
              ]);
            })
          );
        }
        return String(value);
      }

      var PagePreview = createClass({
        render: function () {
          var data = this.props.entry.get("data").toJS();
          return h("div", { className: "preview" }, [
            h("div", { className: "preview-guide", key: "guide" }, [
              h("strong", {}, "Preview"),
              " This is a quick read-through of what you have typed. Check the spelling and numbers, then click Publish. The live site updates in about 2 minutes.",
            ]),
            h("div", { key: "content", style: { fontSize: "15px", lineHeight: 1.55 } }, renderValue(data, 0, "root")),
          ]);
        },
      });

      CMS.registerPreviewTemplate("projects", ProjectPreview);
      CMS.registerPreviewTemplate("products", ProductPreview);
      ["home", "about", "services", "contact", "map", "estimator"].forEach(function (name) {
        CMS.registerPreviewTemplate(name, PagePreview);
      });
    </script>
  </body>
</html>
