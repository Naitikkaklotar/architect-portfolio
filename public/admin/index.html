<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <title>KK Architect — Admin</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=EB+Garamond:wght@400;500;600&family=Inter:wght@400;500;600&family=Jost:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/admin/admin.css" />
  </head>
  <body>
    <a class="kk-help" href="/admin/guide.html" target="_blank" rel="noopener" title="Help &amp; guide" aria-label="Help and guide">?</a>
    <!-- Pinned version + integrity hash: a new Decap release cannot silently change or break the admin. -->
    <script
      src="https://unpkg.com/decap-cms@3.17.3/dist/decap-cms.js"
      integrity="sha384-RWRzuHfiZSWCt3nEvG7B0v3cMgM1C2UuJmgBSL92GQh4uXmNSkbcthql/mNBqvjr"
      crossorigin="anonymous"
    ></script>
    <script>
      // Mark the optional "Extra: ..." fields so the stylesheet can set them apart.
      (function () {
        function mark() {
          var firstDone = false;
          document.querySelectorAll('[class*="ControlContainer"]').forEach(function (box) {
            var label = box.querySelector('[class*="FieldLabel"]');
            var isExtra = label && /^\s*extra\b/i.test(label.textContent || "");
            if (isExtra) {
              box.classList.add("kk-extra");
              if (!firstDone && !document.querySelector(".kk-extra-first")) {
                box.classList.add("kk-extra-first");
              }
              firstDone = true;
            }
          });
        }
        var timer;
        new MutationObserver(function () {
          clearTimeout(timer);
          timer = setTimeout(mark, 150);
        }).observe(document.documentElement, { childList: true, subtree: true });
      })();

      CMS.registerPreviewStyle("/admin/preview.css");

      // Never let a half-filled form crash the preview: only accept real text paths/URLs.
      function safeAsset(getAsset, value) {
        if (typeof value !== "string" || !value) return "";
        try {
          var asset = getAsset(value);
          return asset ? asset.toString() : "";
        } catch (e) {
          return "";
        }
      }

      var ProjectPreview = createClass({
        render: function () {
          var entry = this.props.entry;
          var getAsset = this.props.getAsset;
          var title = entry.getIn(["data", "title"]) || "Untitled project";
          var category = entry.getIn(["data", "category"]) || "";
          var location = entry.getIn(["data", "location"]) || "";
          var year = entry.getIn(["data", "year"]) || "";
          var area = entry.getIn(["data", "area"]) || "";
          var featured = entry.getIn(["data", "featured"]);
          var cover = entry.getIn(["data", "cover"]);
          var images = entry.getIn(["data", "images"]);
          var video = entry.getIn(["data", "video"]);

          var meta = [category, location, year, area].filter(Boolean).join(" · ");

          var coverSrc = safeAsset(getAsset, cover);
          var coverNode = coverSrc
            ? h("img", {
                className: "preview-cover",
                src: coverSrc,
                alt: title + " cover",
              })
            : h(
                "div",
                { className: "preview-cover-empty" },
                "Upload a cover photo to see it here"
              );

          var galleryNodes = [];
          if (images && images.size) {
            images.forEach(function (img, index) {
              var path = typeof img === "string" ? img : img && img.get ? img.get("image") : "";
              var src = safeAsset(getAsset, path);
              if (!src) return;
              galleryNodes.push(
                h("img", {
                  key: index + src,
                  src: src,
                  alt: title + " gallery",
                })
              );
            });
          }

          return h("div", { className: "preview" }, [
            h("div", { className: "preview-guide", key: "guide" }, [
              h("strong", {}, "Live preview"),
              " Fill the form on the left. This pane shows how the project will roughly look on the site.",
            ]),
            coverNode,
            featured
              ? h("span", { className: "preview-badge", key: "badge" }, "Featured on homepage")
              : null,
            h("h1", { className: "preview-title", key: "title" }, title),
            h("p", { className: "preview-meta", key: "meta" }, meta || "Add category, location & year"),
            video
              ? h(
                  "p",
                  { className: "preview-meta", key: "video" },
                  "Video linked: " + video
                )
              : null,
            h("div", { className: "preview-body", key: "body" }, this.props.widgetFor("body")),
            galleryNodes.length
              ? h("div", { className: "preview-gallery", key: "gallery" }, galleryNodes)
              : null,
          ]);
        },
      });

      var ProductPreview = createClass({
        render: function () {
          var entry = this.props.entry;
          var getAsset = this.props.getAsset;
          var title = entry.getIn(["data", "title"]) || "Untitled product";
          var category = entry.getIn(["data", "category"]) || "";
          var price = entry.getIn(["data", "price"]) || "";
          var summary = entry.getIn(["data", "summary"]) || "";
          var coverSrc = safeAsset(getAsset, entry.getIn(["data", "cover"]));

          return h("div", { className: "preview" }, [
            coverSrc
              ? h("img", {
                  key: "cover",
                  className: "preview-cover",
                  src: coverSrc,
                  alt: title,
                })
              : h("div", { key: "empty", className: "preview-cover-empty" }, "Add a cover image to see it here"),
            h("h1", { className: "preview-title", key: "title" }, title),
            h("p", { className: "preview-meta", key: "meta" }, [category, price].filter(Boolean).join(" · ") || "Add category and price note"),
            summary ? h("p", { key: "summary" }, summary) : null,
            h("div", { className: "preview-body", key: "body" }, this.props.widgetFor("body")),
          ]);
        },
      });

      // Readable preview for the text pages and settings (Home, About, Services, Contact, Map, Estimator).
      function renderValue(value, depth, key) {
        if (value === null || value === undefined || value === "") return null;
        if (Array.isArray(value)) {
          return h(
            "ul",
            { key: key, style: { margin: "4px 0 10px", paddingLeft: "20px" } },
            value.map(function (item, i) {
              return h("li", { key: i, style: { marginBottom: "6px" } }, renderValue(item, depth + 1, i));
            })
          );
        }
        if (typeof value === "object") {
          return h(
            "div",
            { key: key },
            Object.keys(value).map(function (k) {
              var inner = renderValue(value[k], depth + 1, k);
              if (inner === null) return null;
              return h("div", { key: k, style: { marginBottom: "4px" } }, [
                h("span", { key: "k", style: { opacity: 0.55, fontSize: "12px", textTransform: "uppercase", letterSpacing: "0.06em" } }, k.replace(/_/g, " ") + " "),
                h("span", { key: "v" }, inner),
              ]);
            })
          );
        }
        return String(value);
      }

      var PagePreview = createClass({
        render: function () {
          var data = this.props.entry.get("data").toJS();
          return h("div", { className: "preview" }, [
            h("div", { className: "preview-guide", key: "guide" }, [
              h("strong", {}, "Preview"),
              " This is a quick read-through of what you have typed. Check the spelling and numbers, then Save and Publish.",
            ]),
            h("div", { key: "content", style: { fontSize: "15px", lineHeight: 1.55 } }, renderValue(data, 0, "root")),
          ]);
        },
      });

      CMS.registerPreviewTemplate("projects", ProjectPreview);
      CMS.registerPreviewTemplate("products", ProductPreview);
      ["home", "about", "services", "contact", "map", "estimator"].forEach(function (name) {
        CMS.registerPreviewTemplate(name, PagePreview);
      });
    </script>
  </body>
</html>
